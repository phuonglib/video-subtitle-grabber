<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Video</title>
  <link rel="icon" href="icons/icon32.png" />
  <link rel="stylesheet" href="fonts/fonts.css" />
  <link rel="stylesheet" href="style.css" />
  <style>
    body { max-width: 760px; margin: 0 auto; padding: 24px 16px; font-size: 14px; }
    h1 { font-size: 20px; margin: 0 0 12px; }
    #log { font: 12px/1.5 ui-monospace, Menlo, monospace; white-space: pre-wrap; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-top: 12px; }
    #log:empty { display: none; }
    .ok { color: var(--ok); } .err { color: var(--err); }
  </style>
</head>
<body>
  <h1 id="title"></h1>
  <div class="bar"><div id="bar"></div></div>
  <div class="muted" id="status" style="margin-top:6px" data-i18n="preparing"></div>
  <div class="actions" style="margin-top:12px"><button id="stop" data-i18n="stop"></button></div>
  <div id="log" class="ok"></div>
  <p class="muted" data-i18n="keepOpen"></p>
  <script type="module" src="filesave.js"></script>
</body>
</html>
